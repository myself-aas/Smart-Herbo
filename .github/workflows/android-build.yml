name: Build Android App

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify Android APK
        id: android_artifact
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "Android APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload Android APK Artifact
        if: steps.android_artifact.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ steps.android_artifact.outputs.apk_path }}

      - name: Commit & push android/** to android branch
        if: steps.android_artifact.outputs.built == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin android || true

          PUBLISH_DIR="$RUNNER_TEMP/publish-android"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

          if git ls-remote --exit-code --heads origin android >/dev/null 2>&1; then
            git worktree add -B android "$PUBLISH_DIR" origin/android
          else
            git worktree add --detach "$PUBLISH_DIR"
            (
              cd "$PUBLISH_DIR"
              git switch --orphan android
              git rm -rf . >/dev/null 2>&1 || true
              git clean -fdx
              git commit --allow-empty -m "chore: initialize android branch"
            )
          fi

          (
            cd "$PUBLISH_DIR"
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
            mkdir -p android
          )

          rsync -a --delete android/ "$PUBLISH_DIR/android/"

          (
            cd "$PUBLISH_DIR"
            git add android
            if git diff --cached --quiet; then
              echo "No android/** changes to commit."
              exit 0
            fi
            git commit -m "ci: update android branch from ${GITHUB_SHA}"
            git push origin android
          )

          git worktree remove "$PUBLISH_DIR" --force
