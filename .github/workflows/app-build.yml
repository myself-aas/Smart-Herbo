name: Build Capacitor Apps (Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ==========================================
  # ANDROID BUILD JOB
  # ==========================================
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # iOS BUILD JOB
  # ==========================================
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    continue-on-error: true  # iOS is optional for now

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Create iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
          else
            echo "Podfile not found. Skipping CocoaPods installation."
          fi

      - name: Build iOS App
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
                       -scheme App \
                       -sdk iphonesimulator \
                       -configuration Debug \
                       -derivedDataPath build \
                       clean build
          else
            echo "iOS platform not initialized. Skipping iOS build."
          fi

      - name: Compress iOS Build Output
        if: success()
        run: |
          if [ -d "ios/App/build" ]; then
            zip -r ios-debug-build.zip ios/App/build
          fi

      - name: Upload iOS Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios-debug-build.zip
