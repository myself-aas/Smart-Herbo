name: Build Capacitor Apps (Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # ANDROID BUILD JOB
  # ==========================================
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Build marker: set output only if APK really exists
      - name: Verify Android build output
        id: android_marker
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "Android APK found."
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "Android APK not found."
          fi

      - name: Upload Android APK Artifact
        if: steps.android_marker.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit & push android/** to android branch
        if: steps.android_marker.outputs.built == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            echo "android directory missing, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin android || true

          if git ls-remote --exit-code --heads origin android >/dev/null 2>&1; then
            git switch -C android --track origin/android
          else
            git switch --orphan android
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          fi

          # Clean branch content, then restore ONLY android/** from source commit
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          git checkout "$GITHUB_SHA" -- android

          git add android
          if git diff --cached --quiet; then
            echo "No android/** changes to commit."
            exit 0
          fi

          git commit -m "ci: update android branch from ${GITHUB_SHA}"
          git push origin android

  # ==========================================
  # iOS BUILD JOB
  # ==========================================
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    continue-on-error: true  # keep optional; marker prevents false pushes

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Create iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
          else
            echo "Podfile not found. Skipping CocoaPods installation."
          fi

      - name: Build iOS App
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
                       -scheme App \
                       -sdk iphonesimulator \
                       -configuration Debug \
                       -derivedDataPath ios/App/build \
                       clean build
          else
            echo "iOS platform not initialized. Skipping iOS build."
            exit 1
          fi

      # Build marker: set output only if xcodebuild artifacts really exist
      - name: Verify iOS build output
        id: ios_marker
        run: |
          if [ -d "ios/App/build" ] && find "ios/App/build" -type d -name "*.app" | grep -q .; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "iOS build artifacts found."
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "iOS build artifacts not found."
          fi

      - name: Compress iOS Build Output
        if: steps.ios_marker.outputs.built == 'true'
        run: |
          zip -r ios-debug-build.zip ios/App/build

      - name: Upload iOS Artifact
        if: steps.ios_marker.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios-debug-build.zip

      - name: Commit & push ios/** to ios branch
        if: steps.ios_marker.outputs.built == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if [ ! -d "ios" ]; then
            echo "ios directory missing, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin ios || true

          if git ls-remote --exit-code --heads origin ios >/dev/null 2>&1; then
            git switch -C ios --track origin/ios
          else
            git switch --orphan ios
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          fi

          # Clean branch content, then restore ONLY ios/** from source commit
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          git checkout "$GITHUB_SHA" -- ios

          git add ios
          if git diff --cached --quiet; then
            echo "No ios/** changes to commit."
            exit 0
          fi

          git commit -m "ci: update ios branch from ${GITHUB_SHA}"
          git push origin ios