name: Build Capacitor Apps (Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # ANDROID BUILD JOB
  # ==========================================
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Build marker: true only if APK exists
      - name: Verify Android build output
        id: android_marker
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "Android APK found."
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "Android APK not found."
          fi

      - name: Upload Android APK Artifact
        if: steps.android_marker.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit & push android/** to android branch
        if: steps.android_marker.outputs.built == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            echo "android directory missing, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin android || true

          PUBLISH_DIR="$RUNNER_TEMP/publish-android"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

          if git ls-remote --exit-code --heads origin android >/dev/null 2>&1; then
            git worktree add -B android "$PUBLISH_DIR" origin/android
          else
            git worktree add --detach "$PUBLISH_DIR"
            (
              cd "$PUBLISH_DIR"
              git switch --orphan android
              git rm -rf . >/dev/null 2>&1 || true
              git clean -fdx
              git commit --allow-empty -m "chore: initialize android branch"
            )
          fi

          (
            cd "$PUBLISH_DIR"
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
            mkdir -p android
          )

          rsync -a --delete android/ "$PUBLISH_DIR/android/"

          (
            cd "$PUBLISH_DIR"
            git add android
            if git diff --cached --quiet; then
              echo "No android/** changes to commit."
              exit 0
            fi
            git commit -m "ci: update android branch from ${GITHUB_SHA}"
            git push origin android
          )

          git worktree remove "$PUBLISH_DIR" --force

  # ==========================================
  # iOS BUILD JOB
  # ==========================================
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    continue-on-error: true  # optional, marker prevents false branch pushes

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Create iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
          else
            echo "Podfile not found. Skipping CocoaPods installation."
          fi

      - name: Build iOS App
        id: ios_build
        run: |
          set -euo pipefail

          WS1="ios/App/App.xcworkspace"
          WS2="ios/App.xcworkspace"

          if [ -d "$WS1" ]; then
            WORKSPACE="$WS1"
          elif [ -d "$WS2" ]; then
            WORKSPACE="$WS2"
          else
            echo "No .xcworkspace found. Listing ios tree for debugging:"
            find ios -maxdepth 4 -print || true
            exit 1
          fi

          echo "Using workspace: $WORKSPACE"

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath ios/build \
                     clean build

      # Build marker: true only if .app artifacts exist
      - name: Verify iOS build output
        id: ios_marker
        run: |
          if [ -d "ios/build" ] && find "ios/build" -type d -name "*.app" | grep -q .; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "iOS build artifacts found."
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "iOS build artifacts not found."
            find ios -maxdepth 5 -print || true
          fi

      - name: Compress iOS Build Output
        if: steps.ios_marker.outputs.built == 'true'
        run: |
          cd ios
          zip -r ../ios-debug-build.zip build

      - name: Upload iOS Artifact
        if: steps.ios_marker.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios-debug-build.zip

      - name: Commit & push ios/** to ios branch
        if: steps.ios_marker.outputs.built == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if [ ! -d "ios" ]; then
            echo "ios directory missing, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin ios || true

          PUBLISH_DIR="$RUNNER_TEMP/publish-ios"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

          if git ls-remote --exit-code --heads origin ios >/dev/null 2>&1; then
            git worktree add -B ios "$PUBLISH_DIR" origin/ios
          else
            git worktree add --detach "$PUBLISH_DIR"
            (
              cd "$PUBLISH_DIR"
              git switch --orphan ios
              git rm -rf . >/dev/null 2>&1 || true
              git clean -fdx
              git commit --allow-empty -m "chore: initialize ios branch"
            )
          fi

          (
            cd "$PUBLISH_DIR"
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
            mkdir -p ios
          )

          rsync -a --delete ios/ "$PUBLISH_DIR/ios/"

          (
            cd "$PUBLISH_DIR"
            git add ios
            if git diff --cached --quiet; then
              echo "No ios/** changes to commit."
              exit 0
            fi
            git commit -m "ci: update ios branch from ${GITHUB_SHA}"
            git push origin ios
          )

          git worktree remove "$PUBLISH_DIR" --force