name: Build Capacitor Apps (Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ==========================================
  # ANDROID BUILD JOB
  # ==========================================
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Package-lock
        run: npm add package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Initiate & Sync Capacitor Android
        run: |
          # Add android platform if not present, then sync
          npx cap add android || true
          npx cap copy android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # iOS BUILD JOB
  # ==========================================
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Initiate & Sync Capacitor iOS
        run: |
          # Add ios platform if not present, then sync
          npx cap add ios || true
          npx cap copy ios || true
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS App (.xcarchive)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build \
                     clean build

      - name: Compress iOS Build Output
        run: |
          zip -r ios-debug-build.zip ios/App/build

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios-debug-build.zip
